[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "EasyGlobals"
version = "0.2.1"
dependencies = []
authors = [
  { name="Y", email="asnaeb2@gmail.com" },
]
description = "Effortless variable sharing between Python processes: attribute-style shared globals at shared-memory speed. Pure Python, no server, no dependencies."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
keywords = ['Python', 'Globals', 'Shared memory', 'Multiprocessing', 'IPC']

[project.optional-dependencies]
numpy = ["numpy"]

[project.urls]
"Homepage" = "https://github.com/YacobBY/Easy_Globals"
"Bug Tracker" = "https://github.com/YacobBY/Easy_Globals/issues"

[tool.hatch.build.targets.sdist]
exclude = [".foreman/", ".idea/", "venv/", "RELEASE_NOTES_*.md", "build_instructions.txt"]
